name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
        continue-on-error: true

  # Job E2E retire : il echouait a chaque execution depuis sa creation.
  # Le serveur lance par playwright.config.ts (`npm run dev`) ne demarre pas
  # sans les variables Sanity, et Playwright abandonne apres 120 s :
  #   [WebServer] Error: Configuration must contain `projectId`
  #
  # Pour le retablir :
  #   1. Definir NEXT_PUBLIC_SANITY_PROJECT_ID, NEXT_PUBLIC_SANITY_DATASET,
  #      NEXT_PUBLIC_SANITY_API_VERSION et NEXTAUTH_SECRET dans les secrets
  #      du depot (Settings > Secrets and variables > Actions).
  #   2. Restaurer le job depuis l'historique git (`git show efc6f8b:.github/workflows/tests.yml`)
  #      en lui ajoutant un bloc `env:` qui injecte ces secrets.
  #   3. Etoffer tests/e2e/user-journey.spec.ts : le parcours complet y est
  #      encore en `test.skip`, seuls deux tests de navigation s'executent.
